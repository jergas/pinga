[package]
name = "pinga"
version = "0.1.0"
edition = "2021"
description = "TUI console managing opencode and codex sessions"

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.1"
fs2 = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "2", default-features = false, features = ["json"] }

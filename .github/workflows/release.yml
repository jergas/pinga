name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ships as a static musl build: it runs on EVERY Linux
          # (glibc and musl alike, incl. NixOS where the glibc loader is a
          # deliberate stub). macOS ships native per-arch builds; both are
          # cross-compiled on the arm64 mac runner (Rust handles macOS
          # cross-arch natively) — no Intel-mac runner needed.
          - os: ubuntu-latest
            asset: pinga-linux-x86_64
            target: x86_64-unknown-linux-musl
            build_dir: target/x86_64-unknown-linux-musl/release
            extra_target: ""
            pkgs: musl-tools
          - os: macos-latest
            asset: pinga-macos-aarch64
            target: ""
            build_dir: target/release
            extra_target: ""
            pkgs: ""
          - os: macos-latest
            asset: pinga-macos-x86_64
            target: x86_64-apple-darwin
            build_dir: target/x86_64-apple-darwin/release
            extra_target: x86_64-apple-darwin
            pkgs: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install musl toolchain or extra target
        if: matrix.extra_target != '' || matrix.pkgs != ''
        run: |
          if [ -n "${{ matrix.pkgs }}" ]; then sudo apt-get update && sudo apt-get install -y ${{ matrix.pkgs }}; fi
          if [ -n "${{ matrix.extra_target }}" ]; then rustup target add ${{ matrix.extra_target }}; fi
      - name: tangle the literate source
        # src/ is gitignored (derived from blueprint.md), so a fresh checkout
        # has no targets; regenerate before building.
        run: python3 tools/tangle.py blueprint.md
      - run: cargo build --release ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
      - name: package asset + checksum
        run: |
          cd ${{ matrix.build_dir }}
          if command -v sha256sum >/dev/null 2>&1; then sha256sum pinga; else shasum -a 256 pinga; fi > "${{ matrix.asset }}.sha256"
          cp pinga "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.build_dir }}/${{ matrix.asset }}
            ${{ matrix.build_dir }}/${{ matrix.asset }}.sha256

  deploy-bundle:
    name: package deploy units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build deploy tarball
        run: |
          mkdir bundle
          cp deploy/pinga-tmux-save deploy/pinga-tmux-restore bundle/
          cp deploy/pinga-tmux-save.service deploy/pinga-tmux-save.timer \
             deploy/pinga-tmux-restore.service deploy/pinga-up.service bundle/
          tar czf pinga-deploy.tar.gz -C bundle .
          sha256sum pinga-deploy.tar.gz > pinga-deploy.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: |
            pinga-deploy.tar.gz
            pinga-deploy.tar.gz.sha256

  release:
    name: create GitHub release
    needs: [build, deploy-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: list assets
        run: find assets -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/**/*
          generate_release_notes: true